<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عيد ميلاد سلمى 🎂</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #050505, #2b1b3d);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
}

.box {
  padding: 35px;
  border-radius: 25px;
  background: rgba(255,255,255,0.08);
  box-shadow: 0 0 30px rgba(255,255,255,0.2);
}

h1 {
  font-size: 38px;
}

p {
  font-size: 22px;
}

button {
  margin-top: 25px;
  padding: 15px 35px;
  border: none;
  border-radius: 30px;
  background: #d4af37;
  color: black;
  font-size: 20px;
  cursor: pointer;
}

button:hover {
  transform: scale(1.05);
}
</style>

</head>

<body>

<div class="box">
<h1>سلومي 💛</h1>
<p>في مفاجأة بانتظارك ✨</p>
<p>جاهزة للمتعة؟ 🎁</p>

<button onclick="openGift()">افتحي المفاجأة 🎀</button>
</div>

<script>
function openGift(){
 alert("لسه البداية يا سلومي 😍✨ المفاجأة الكبرى جاية!");
}
</script>

</body>
</html>
