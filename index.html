<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عيد ميلاد سلمى 🎂</title>

<style>

body {
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#050505,#2b1b3d);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
  color:white;
  text-align:center;
}

.box {
  padding:35px;
  border-radius:25px;
  background:rgba(255,255,255,0.08);
  box-shadow:0 0 30px rgba(255,255,255,0.2);
  max-width:500px;
  width:90%;
}

h1 {
  font-size:36px;
}

p {
  font-size:21px;
  line-height:1.8;
}

button {
  margin-top:20px;
  padding:15px 35px;
  border:none;
  border-radius:30px;
  background:#d4af37;
  color:black;
  font-size:20px;
  cursor:pointer;
}

button:hover {
  transform:scale(1.05);
}

.gifts {
  display:flex;
  justify-content:center;
  gap:20px;
}

.gift {
  font-size:55px;
  cursor:pointer;
}

img, video {
  width:100%;
  border-radius:20px;
  margin-top:20px;
}

.heart {
  font-size:45px;
  animation:heart 1s infinite;
}

@keyframes heart {
  50% {
    transform:scale(1.4);
  }
}

</style>

</head>


<body>


<div class="box" id="box">

<h1>سلومي 💛</h1>

<p>في مفاجأة بانتظارك ✨</p>

<p>جاهزة للمتعة؟ 🎁</p>

<button onclick="start()">افتحي المفاجأة 🎀</button>

</div>


<script>

let box=document.getElementById("box");


function start(){

box.innerHTML=`

<h1>🎉 أول مرحلة 🎉</h1>

<p>
قبل ما توصلي للمفاجأة الكبرى...
<br>
لازم نلعب لعبة صغيرة 😏💜
</p>

<button onclick="question1()">يلا نبدأ 🚀</button>

`;

}



function question1(){

box.innerHTML=`

<h1>❓ السؤال الأول</h1>

<p>
لو رجع فينا الزمن...<br>
بتختاريني أكون صاحبتك مرة ثانية؟ 💜
</p>

<button onclick="correct1()">❤️ أكيد</button>

<br><br>

<button onclick="wrong()">لا 😂</button>

`;

}



function correct1(){

box.innerHTML=`

<div class="heart">❤️❤️❤️</div>

<h1>🥰</h1>

<p>
يلا نكمل المفاجأة ✨
</p>

<button onclick="question2()">نكمل ➜</button>

`;

}



function question2(){

box.innerHTML=`

<h1>❓ السؤال الثاني</h1>

<p>
تتذكري وعدنا؟ 🤭💜<br>
بنضل سوا لحد...
</p>

<button onclick="boxes()">🫂 90 سنة 💜</button>

<br><br>

<button onclick="wrong()">😂 يوم واحد بس</button>

`;

}



function wrong(){

alert("غلط 😂 جربي مرة ثانية!");

}


function boxes(){

box.innerHTML=`

<h1>🎁 صناديق المفاجأة 🎀</h1>

<p>اختاري صندوقك 💜</p>

<div class="gifts">

<div class="gift" onclick="gift1()">🎁</div>

<div class="gift" onclick="gift2()">🎁</div>

<div class="gift" onclick="gift3()">🎁</div>

</div>

`;

}function gift1(){

box.innerHTML=`

<h1>🎁 الصندوق الأول 💜</h1>

<p>
وجودك بحياتي صدفة، بس من أحلى الصدف، انتي نعمة من ربنا بحمد الله عليها دايمًا 💜🫂
</p>

<button onclick="boxes()">رجوع 🎁</button>

`;

}



function gift2(){

box.innerHTML=`

<h1>🎁 الصندوق الثاني 💛</h1>

<p>
وجودك معوضني عن كل شيء
<br>
وروحي فيك حرفيًا
<br>
مستعدة أعطيكي عيني قبل قلبي ما أنحرم منك 🫂
</p>

<button onclick="boxes()">رجوع 🎁</button>

`;

}



function gift3(){

box.innerHTML=`

<h1>🎁 الصندوق الثالث ✨</h1>

<p>
عارفة إني بحبك؟ انتي صاحبتي وعمري
<br>
بتطمن بوجودك وانتي معي ما بكون بحاجة حدا 💜
</p>

<button onclick="message()">الرسالة الكبيرة 💌</button>

`;

}



function message(){

box.innerHTML=`

<h1>💌 إلى سلومي</h1>

<p>
سلومي القلب والغلى كلو اغلى من روحي بحبك جدا ربي ما يحرمني منك
<br><br>
كنت بتمنى بهاليوم اكون معك بس الظروف بتمنع وانتي عارفة
<br><br>
حبيت اعملك اشي يكون حلو بتمنى يعجبك
<br><br>
كوني عارفة شو ماصار هضل احبك لاخر يوم بحياتي
<br><br>
قلبي وعيوني وروحي وانا بدونك ولا اشي
<br><br>
انتي احلا اشي صار بعمري واحلا نعمة من ربنا
<br><br>
الله ما يحرمني منك
<br><br>
بتمنالك عيد ميلاد سعيد كل عام وانتي بألف خير قلب
<br><br>
يارب سنينك الجاي تكون احلا ومتل ما بتتمني
<br><br>
ويبعتلك كل الخير والايام الحلوة
<br><br>
لنا لقاء ب اذن الله
<br><br>
بحبك العمر كلو 🫂💜
</p>


<img src="1781566303207.png">


<button onclick="finalVideo()">
الخاتمة 🎂
</button>


`;

}



function finalVideo(){

box.innerHTML=`

<h1>🎂 المفاجأة الأخيرة 🎂</h1>

<p>
هاي آخر مفاجأة إلك يا سلومي 💜✨
</p>


<video controls autoplay>

<source src="lv_0_20260731013714.mp4" type="video/mp4">

</video>


<p>
كل عام وانتي بخير يا سلومي ❤️
</p>


`;

}


</script>

</body>

</html>
